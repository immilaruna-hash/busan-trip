/* ================= 사진 꾸미기 (스티커 · 글자 · 펜) ================= */
const DC = { layers: [], sel: -1, pen: false, sub: null, penColor: '#ffffff', penW: 8, newColor: '#ffffff', newStroke: true };
const COLORS = ['#ffffff', '#0f172a', '#0ea5e9', '#facc15', '#f472b6', '#ef4444', '#22c55e', '#a855f7'];
const EMOJIS = ['❤️', '⭐', '✨', '🌊', '🏖️', '😎', '🥰', '🎢', '🚄', '🐟', '🍜', '🥩', '📸', '👍', '🔥', '🎉', '💙', '☁️'];
const FONT = '"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif';

async function openDecorate(p) {
  let img;
  try { img = await loadImg(urlOf(p, 'full')); } catch (e) { return toast(e.message); }
  ED.c.classList.remove('checker');
  ED.c.width = img.naturalWidth; ED.c.height = img.naturalHeight;
  Object.assign(DC, { base: img, photo: p, layers: [], sel: -1, pen: false, sub: null, drag: null, pinch: null });
  DC.penW = Math.round(img.naturalWidth / 120);
  ED.mode = 'deco';
  dcRender(); dcPanel();
  openEditor('🎨 사진 꾸미기', '저장');
}
function lsize(l, ctx) {
  if (l.type === 'img') return [l.size, l.size * l.img.naturalHeight / l.img.naturalWidth];
  ctx.font = `900 ${l.size}px ${FONT}`;
  return [Math.max(ctx.measureText(l.text).width, l.size * 0.6), l.size * 1.2];
}
function dcRender(noSel) {
  const ctx = ED.ctx, c = ED.c;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(DC.base, 0, 0);
  DC.layers.forEach((l, i) => {
    ctx.save();
    if (l.type === 'path') {
      ctx.strokeStyle = l.color; ctx.lineWidth = l.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); l.pts.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      if (l.pts.length === 1) ctx.lineTo(l.pts[0][0] + 0.1, l.pts[0][1]);
      ctx.stroke(); ctx.restore(); return;
    }
    ctx.translate(l.x, l.y); ctx.rotate(l.rot);
    const [w, h] = lsize(l, ctx);
    if (l.type === 'img') ctx.drawImage(l.img, -w / 2, -h / 2, w, h);
    else {
      ctx.font = `900 ${l.size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (l.stroke) { ctx.lineWidth = l.size * 0.16; ctx.lineJoin = 'round'; ctx.strokeStyle = l.color === '#0f172a' ? '#ffffff' : '#0f172a'; ctx.strokeText(l.text, 0, 0); }
      ctx.fillStyle = l.color; ctx.fillText(l.text, 0, 0);
    }
    if (!noSel && i === DC.sel) {
      ctx.setLineDash([c.width / 80, c.width / 120]); ctx.lineWidth = Math.max(2, c.width / 400); ctx.strokeStyle = '#0ea5e9';
      ctx.strokeRect(-w / 2 - 8, -h / 2 - 8, w + 16, h + 16);
    }
    ctx.restore();
  });
}
function dcHit(x, y) {
  for (let i = DC.layers.length - 1; i >= 0; i--) {
    const l = DC.layers[i]; if (l.type === 'path') continue;
    const [w, h] = lsize(l, ED.ctx);
    const dx = x - l.x, dy = y - l.y, cs = Math.cos(l.rot), sn = Math.sin(l.rot);
    const lx = dx * cs + dy * sn, ly = -dx * sn + dy * cs;
    const pad = 14 * pxScale();
    if (Math.abs(lx) <= w / 2 + pad && Math.abs(ly) <= h / 2 + pad) return i;
  }
  return -1;
}
function dcDown(e) {
  const [x, y] = cxy(e);
  if (DC.pen) { DC.layers.push({ type: 'path', pts: [[x, y]], color: DC.penColor, w: DC.penW }); DC.drawing = true; dcRender(); return; }
  if (ED.ptrs.size === 2 && DC.sel >= 0) {
    const [a, b] = [...ED.ptrs.values()], l = DC.layers[DC.sel];
    DC.pinch = { d0: Math.hypot(b[0] - a[0], b[1] - a[1]), a0: Math.atan2(b[1] - a[1], b[0] - a[0]), s0: l.size, r0: l.rot };
    DC.drag = null; return;
  }
  if (ED.ptrs.size > 1) return;
  const i = dcHit(x, y);
  const changed = i !== DC.sel;
  DC.sel = i;
  if (i >= 0) { const l = DC.layers[i]; DC.drag = { ox: x - l.x, oy: y - l.y }; DC.sub = null; }
  dcRender(); if (changed) dcPanel();
}
function dcMove(e) {
  if (DC.pen && DC.drawing) { const last = DC.layers[DC.layers.length - 1]; last.pts.push(cxy(e)); dcRender(); return; }
  const l = DC.layers[DC.sel]; if (!l) return;
  if (DC.pinch && ED.ptrs.size >= 2) {
    const [a, b] = [...ED.ptrs.values()];
    l.size = Math.max(10, DC.pinch.s0 * Math.hypot(b[0] - a[0], b[1] - a[1]) / DC.pinch.d0);
    l.rot = DC.pinch.r0 + Math.atan2(b[1] - a[1], b[0] - a[0]) - DC.pinch.a0;
    dcRender(); return;
  }
  if (DC.drag) { const [x, y] = cxy(e); l.x = x - DC.drag.ox; l.y = y - DC.drag.oy; dcRender(); }
}
function dcUp() {
  if (DC.drawing) { DC.drawing = false; return; }
  if (ED.ptrs.size < 2) DC.pinch = null;
  if (ED.ptrs.size === 0) { DC.drag = null; dcPanel(); }
}
function addLayer(l) {
  DC.layers.push({ x: ED.c.width / 2, y: ED.c.height / 2, rot: 0, ...l });
  DC.sel = DC.layers.length - 1; DC.pen = false; DC.sub = null;
  dcRender(); dcPanel();
}
const swatches = (cur, key) => `<div class="colors">${COLORS.map(c => `<button class="sw ${c === cur ? 'on' : ''}" style="background:${c}" data-color="${c}" data-key="${key}"></button>`).join('')}</div>`;

function dcPanel() {
  const l = DC.layers[DC.sel];
  const W = ED.c.width;
  let sub = '';
  if (DC.sub === 'sticker') {
    sub = `<p class="ed-msg" style="margin-top:12px;font-weight:700">이모지 스티커</p>
      <div class="emojis">${EMOJIS.map(em => `<button data-emoji="${em}">${em}</button>`).join('')}</div>
      <p class="ed-msg" style="font-weight:700">내 스티커</p>
      ${stickers.length ? `<div class="stk-strip">${stickers.map(s => `<button class="stk" data-stk="${s.id}"><img src="${urlOf(s, 'blob')}" alt=""></button>`).join('')}</div>`
        : `<p class="ed-msg">아직 없어요. 사진첩의 ✨ 스티커 추가하기로 만들 수 있어요.</p>`}`;
  } else if (DC.sub === 'text') {
    sub = `<input type="text" id="dc-newtext" placeholder="넣을 글자를 입력하세요 (예: 부산 최고!)" maxlength="40">
      ${swatches(DC.newColor, 'new')}
      <label class="sl"><input type="checkbox" id="dc-newstroke" ${DC.newStroke ? 'checked' : ''} style="flex:none;width:18px;height:18px;accent-color:var(--sky)"> 글자 테두리</label>
      <div class="actions" style="margin-top:10px"><span class="sp"></span><button class="btn primary sm" data-d="text-add">글자 넣기</button></div>`;
  } else if (DC.pen) {
    sub = `<p class="ed-msg">사진 위에 손가락으로 그려 보세요.</p>${swatches(DC.penColor, 'pen')}
      <label class="sl">펜 굵기 <input type="range" id="dc-penw" min="${Math.max(2, Math.round(W / 400))}" max="${Math.round(W / 25)}" value="${DC.penW}"></label>`;
  } else if (l) {
    sub = `<label class="sl">크기 <input type="range" id="dc-size" min="${Math.round(W / 40)}" max="${Math.round(W * 1.2)}" value="${Math.round(l.size)}"></label>
      <label class="sl">회전 <input type="range" id="dc-rot" min="-180" max="180" value="${Math.round(l.rot * 180 / Math.PI)}"></label>
      ${l.type === 'text' && !l.emoji ? `<input type="text" id="dc-text" value="${esc(l.text)}" maxlength="40">${swatches(l.color, 'sel')}
        <label class="sl"><input type="checkbox" id="dc-stroke" ${l.stroke ? 'checked' : ''} style="flex:none;width:18px;height:18px;accent-color:var(--sky)"> 글자 테두리</label>` : ''}
      <div class="actions" style="margin-top:10px">
        <button class="tool" data-d="front">⬆ 맨 앞으로</button><button class="tool" data-d="dup">⧉ 복사</button>
        <span class="sp"></span><button class="btn danger sm" data-d="del">삭제</button></div>
      <p class="ed-msg">끌어서 옮기고, 두 손가락으로 크기·회전을 바꿀 수 있어요.</p>`;
  } else {
    sub = `<p class="ed-msg">🏷️ 스티커나 🔤 글자를 넣고, 끌어서 옮겨 보세요. 두 손가락으로 크기와 회전을 바꿀 수 있어요. 저장하면 꾸민 사진이 <b>새로</b> 저장되고 원본은 그대로 남아요.</p>`;
  }
  $('#ed-panel').innerHTML = `<div class="tools">
      <button class="tool ${DC.sub === 'sticker' ? 'on' : ''}" data-d="sticker">🏷️ 스티커</button>
      <button class="tool ${DC.sub === 'text' ? 'on' : ''}" data-d="text">🔤 글자</button>
      <button class="tool ${DC.pen ? 'on' : ''}" data-d="pen">✏️ 펜</button>
      <button class="tool" data-d="undo">↩ 되돌리기</button>
    </div>${sub}`;
}
function dcPanelClick(e) {
  const t = e.target.closest('button'); if (!t) return;
  const l = DC.layers[DC.sel];
  if (t.dataset.color) {
    const c = t.dataset.color, k = t.dataset.key;
    if (k === 'pen') DC.penColor = c; else if (k === 'new') DC.newColor = c; else if (l) l.color = c;
    t.parentElement.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s === t));
    dcRender(); return;
  }
  if (t.dataset.emoji) return addLayer({ type: 'text', text: t.dataset.emoji, emoji: true, color: '#000', stroke: false, size: Math.round(ED.c.width / 6) });
  if (t.dataset.stk) {
    const s = stickers.find(x => x.id === t.dataset.stk); if (!s) return;
    loadImg(urlOf(s, 'blob')).then(img => addLayer({ type: 'img', img, size: Math.round(ED.c.width * 0.35) })).catch(() => toast('스티커를 불러오지 못했어요'));
    return;
  }
  const d = t.dataset.d; if (!d) return;
  if (d === 'sticker' || d === 'text') { DC.sub = DC.sub === d ? null : d; DC.pen = false; DC.sel = -1; dcRender(); dcPanel();
    if (DC.sub === 'text') setTimeout(() => $('#dc-newtext')?.focus(), 50); }
  else if (d === 'pen') { DC.pen = !DC.pen; DC.sub = null; DC.sel = -1; dcRender(); dcPanel(); }
  else if (d === 'undo') { if (DC.layers.length) { DC.layers.pop(); DC.sel = -1; dcRender(); dcPanel(); } else toast('되돌릴 게 없어요'); }
  else if (d === 'text-add') {
    const v = ($('#dc-newtext').value || '').trim(); if (!v) return toast('글자를 입력해 주세요');
    addLayer({ type: 'text', text: v, color: DC.newColor, stroke: DC.newStroke, size: Math.round(ED.c.width / 10) });
  }
  else if (d === 'del' && l) { DC.layers.splice(DC.sel, 1); DC.sel = -1; dcRender(); dcPanel(); }
  else if (d === 'front' && l) { DC.layers.splice(DC.sel, 1); DC.layers.push(l); DC.sel = DC.layers.length - 1; dcRender(); }
  else if (d === 'dup' && l) { addLayer({ ...l, x: l.x + ED.c.width / 20, y: l.y + ED.c.width / 20 }); }
}
function dcPanelInput(e) {
  const l = DC.layers[DC.sel], id = e.target.id;
  if (id === 'dc-penw') DC.penW = +e.target.value;
  else if (id === 'dc-newstroke') DC.newStroke = e.target.checked;
  else if (l && id === 'dc-size') l.size = +e.target.value;
  else if (l && id === 'dc-rot') l.rot = +e.target.value * Math.PI / 180;
  else if (l && id === 'dc-text') l.text = e.target.value || ' ';
  else if (l && id === 'dc-stroke') l.stroke = e.target.checked;
  dcRender();
}
async function dcSave() {
  if (!DC.layers.length) return toast('아직 꾸민 게 없어요');
  dcRender(true);
  const full = await new Promise(r => ED.c.toBlob(r, 'image/jpeg', 0.9));
  if (!full) return toast('저장하지 못했어요');
  const thumb = await resize(full, 480, 0.75);
  const src = DC.photo;
  const p = { id: uid(), time: src.time, src: src.src, full, thumb, place: src.place || '', caption: src.caption || '', name: 'deco-' + (src.name || ''), decorated: true, from: src.id, addedAt: Date.now() };
  try { upsertLocal(await savePhoto(p)); } catch (e) { console.warn(e); return toast('⚠️ 저장하지 못했어요. 인터넷 연결을 확인해 주세요'); }
  closeEditor(); renderAlbum(); toast('꾸민 사진을 저장했어요 (원본도 그대로 있어요)');
}

/* ================= 탭 & 이벤트 ================= */
let curTab = 'schedule';
function setTab(t) {
  curTab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['schedule', 'map', 'album'].forEach(v => $('#view-' + v).classList.toggle('hidden', v !== t));
  $('#fab').classList.toggle('hidden', t !== 'album');
  if (t === 'album') renderAlbum(); else if (t === 'map') renderMap(); else renderSchedule();
  try { history.replaceState(null, '', t === 'schedule' ? '#' : '#' + t); } catch (e) {}
  window.scrollTo({ top: 0 });
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab'); if (tab) return setTab(tab.dataset.tab);
  const dt = e.target.closest('[data-dtab]');
  if (dt) { schedDay = +dt.dataset.dtab; renderSchedule(); document.getElementById('daytabs')?.scrollIntoView({ block: 'start' }); return; }
  const nv = e.target.closest('a[data-nv]');
  if (nv && IS_IOS) {   // iOS: 앱이 안 열리면 잠시 뒤 앱스토어(네이버 지도)로 이동
    setTimeout(() => { if (!document.hidden) location.href = 'https://itunes.apple.com/app/id311867728?mt=8'; }, 1600);
  }
  if (e.target.closest('a')) return;
  const b = e.target.closest('[data-act]'); if (!b || b.closest('#modal')) return;
  const a = b.dataset.act;
  if (a === 'edit') itemForm(+b.dataset.day, b.dataset.id);
  else if (a === 'add') itemForm(+b.dataset.day, null);
  else if (a === 'edit-meet') meetForm();
  else if (a === 'route-me') routeMe(b.dataset.t);
  else if (a === 'map-day') { mapDay = +b.dataset.day; $('#map-me').innerHTML = ''; renderMap(); }
  else if (a === 'fly') {
    const i = +b.dataset.i, s = mapStops[i];
    if (map && s) { map.flyTo(s.ll, 16); mapMarkers[i]?.openPopup(); $('.map-card').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    else { const el = document.getElementById('stop-' + i); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1500); } }
  }
  else if (a === 'alert-toggle') toggleAlert();
  else if (a === 'alarm-ok') closeAlarm();
  else if (a === 'camera') $('#cam').click();
  else if (a === 'sticker-new') stickerSourcePicker();
  else if (a === 'sticker-view') viewSticker(b.dataset.id);
  else if (a === 'locate') locateMe();
  else if (a === 'reset') { askConfirm('수정한 일정과 집합 공지를 모두 처음 상태로 되돌릴까요? (사진은 그대로예요)', '되돌리기', true).then(ok => { if (ok) { state = clone(DEFAULT_STATE); saveState(); meetRoute = ''; nowRoute = null; renderSchedule(); toast('처음 일정으로 되돌렸어요'); } }); }
  else if (a === 'filter') { albumFilter = b.dataset.f; renderAlbum(); }
  else if (a === 'view') viewPhoto(b.dataset.id);
  else if (a === 'upload') $('#file').click();
  else if (a === 'move-local') moveLocalPhotos();
});
$('#fab').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });
$('#cam').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });
$('#stk-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) startSticker(f); });

setInterval(() => {
  if (!$('#modal').classList.contains('hidden') || ED.mode) return;
  if (curTab === 'schedule') renderSchedule();
}, 30000);
setInterval(checkAlerts, 15000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  checkAlerts();
  if (sb && auth) refresh();
});

(async function init() {
  await PDB.open();
  stickers = await PDB.all('stickers');
  if (sb) {
    localOnly = await PDB.all();
    startShared();
  } else photos = await PDB.all();
  setTimeout(checkAlerts, 1500);
  const h = location.hash.slice(1);
  setTab(['map', 'album'].includes(h) ? h : 'schedule');
  if (alertCfg.on) syncPush();   // 알림 켜 둔 기기는 푸시 등록 상태를 다시 맞춰 둠
})();
</script>
